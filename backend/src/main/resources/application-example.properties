# Copy this file to application-dev.properties (which is gitignored) and fill in
# YOUR local passwords. Never commit real credentials.
# Run with the dev profile:  spring.profiles.active=dev

# Runtime connection: the least-privileged application role.
spring.datasource.url=jdbc:postgresql://localhost:5433/civicconnect
spring.datasource.username=civicconnect_app
spring.datasource.password=CHANGE_ME_app

# Flyway connects as the owner role so it is allowed to run DDL migrations.
spring.flyway.url=jdbc:postgresql://localhost:5433/civicconnect
spring.flyway.user=civicconnect_owner
spring.flyway.password=CHANGE_ME_owner
