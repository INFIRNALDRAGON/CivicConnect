# CivicConnect
#
#   Database only (develop the backend/frontend on your machine):
#       docker compose up -d db
#
#   Whole application in containers (database + API + built React app on :8080):
#       docker compose --profile full up -d --build
#
#   Stop:                         docker compose down
#   Reset ALL data and re-run the role setup:   docker compose down -v
#
# Host port 5433 avoids clashing with a PostgreSQL installed on Windows (5432).
services:
  db:
    image: postgres:16
    container_name: civicconnect-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: civicconnect
      POSTGRES_USER: ccadmin
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?Copy .env.example to .env first}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?Copy .env.example to .env first}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?Copy .env.example to .env first}
      DB_READONLY_PASSWORD: ${DB_READONLY_PASSWORD:?Copy .env.example to .env first}
    ports:
      - "5433:5432"
    volumes:
      - civicconnect-data:/var/lib/postgresql/data
      - ./db/00_roles.sql:/sql/00_roles.sql:ro
      - ./docker/init/01-roles.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ccadmin -d civicconnect"]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    profiles: ["full"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SHOW_DEMO_ACCOUNTS: ${SHOW_DEMO_ACCOUNTS:-true}
    container_name: civicconnect-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: civicconnect
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
      APP_AUTH_SECRET: ${APP_AUTH_SECRET:?Set APP_AUTH_SECRET in .env (see .env.example)}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:8080}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s

volumes:
  civicconnect-data:
